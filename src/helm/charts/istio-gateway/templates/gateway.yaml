---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: public-ingress-gateway
spec:
  selector:
    istio: ingress

  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "gateway.{{ $.Values.dns.cname }}.{{ $.Values.dns.domain }}"
      tls:
        httpsRedirect: true

    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "gateway.{{ $.Values.dns.cname }}.{{ $.Values.dns.domain }}"
      tls:
        mode: SIMPLE
        credentialName: {{ $.Values.secret.prefix }}wildcard

{{- range $cname := .Values.certificate.list }}
---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: public-ingress-{{ $cname }}
spec:
  selector:
    istio: ingress

  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "{{ $cname }}.{{ $.Values.dns.cname }}.{{ $.Values.dns.domain }}"
      tls:
        httpsRedirect: true

    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "{{ $cname }}.{{ $.Values.dns.cname }}.{{ $.Values.dns.domain }}"
      tls:
        mode: SIMPLE
        credentialName: {{ $.Values.secret.prefix }}wildcard
{{- end }}
